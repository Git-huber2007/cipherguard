# Deliberately weak: the failure modes the analyzer must detect.
# 3DES (64-bit block), MD5 integrity, DH Group 2, 48-hour lifetime, PSK auth.
connections {
    cg-weak {
        version = 1
        aggressive = yes
        proposals = 3des-md5-modp1024
        rekey_time = 172800s
        local_addrs  = 172.30.0.20
        remote_addrs = 172.30.0.10
        local  { auth = psk  id = sun.cipherguard.lab }
        remote { auth = psk  id = sun.cipherguard.lab }
        children {
            cg-weak-child {
                esp_proposals = 3des-md5
                local_ts  = 172.30.0.20/32
                remote_ts = 172.30.0.10/32
                start_action = trap
            }
        }
    }
}
secrets {
    ike-weak { secret = "lab-only-not-a-real-key" }
}

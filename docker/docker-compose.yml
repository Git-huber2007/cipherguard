# CipherGuard reference testbed.
#
# Two strongSwan gateways negotiate a real IPsec tunnel on an isolated bridge
# while a passive sniffer container captures the segment. This produces genuine
# IKE and ESP captures for calibration, as opposed to the synthesised ones the
# `cipherguard lab` command writes offline.
#
# The gateways deliberately run weak configurations. That is the point: the
# testbed has to produce the failures the analyzer claims to detect, otherwise
# the detection is untested. Keep this on an isolated bridge, never on a network
# carrying real traffic.
#
#   docker compose up -d
#   docker compose exec sniffer /capture.sh weak 60
#   docker compose down
#
# Captures land in ./captures on the host, ready for:
#   cipherguard analyze docker/captures/weak.pcap

services:
  moon:
    image: strongx509/strongswan:latest
    container_name: cg-moon
    profiles: ["lab"]
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./strongswan/moon:/etc/swanctl/conf.d:ro
      - ./strongswan/profiles:/profiles:ro
    networks:
      transit:
        ipv4_address: 172.30.0.10
    command: ["/usr/local/sbin/charon-systemd"]

  sun:
    image: strongx509/strongswan:latest
    container_name: cg-sun
    profiles: ["lab"]
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./strongswan/sun:/etc/swanctl/conf.d:ro
      - ./strongswan/profiles:/profiles:ro
    networks:
      transit:
        ipv4_address: 172.30.0.20
    command: ["/usr/local/sbin/charon-systemd"]

  # The sniffer models the production deployment: a passive tap with no address
  # on the transit segment and no ability to originate traffic.
  sniffer:
    image: nicolaka/netshoot:latest
    container_name: cg-sniffer
    profiles: ["lab"]
    cap_add: [NET_ADMIN, NET_RAW]
    network_mode: "service:moon"
    volumes:
      - ./captures:/captures
      - ./capture.sh:/capture.sh:ro
    entrypoint: ["sleep", "infinity"]

networks:
  transit:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
